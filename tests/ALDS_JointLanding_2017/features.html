<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
        <title>ActiveLearn</title>
        <link rel="stylesheet" href="css/activelearn.css" type="text/css" media="screen">
        <link rel="stylesheet" href="css/marketing-pages.css" type="text/css" media="screen">
        <link rel="stylesheet" href="css/font-awesome.css" media="screen" type="text/css">
        <link rel="stylesheet" href="css/new-marketing-page.css" type="text/css" media="screen">
        <script type="text/javascript" src="js/jquery-3.1.1.min.js"></script>
        <script type="text/javascript" src="js/d3.min.js"></script>
        <script type="text/javascript" src="js/trianglify.min.js"></script>
        <script type="text/javascript" src="js/mkt2014.js"></script>
    </head>
    
	<body id="marketing-pages" class="mkt-features">
		<div id="navWrapper"><script>$('#navWrapper').load('mkt-nav.html');</script></div>
        <div id="displayWrapper"><script>$('#displayWrapper').load('templates/mkt-features-display.html');</script></div>
		
		<div id="main">
            <div id="blurb1"></div>
            <div id="blurb2"></div>

            <script>$('#blurb2').load('templates/mkt-features-questions.html');</script>
            <script>$('#blurb1').load('templates/mkt-features-reports.html');</script>
		</div>
		
        <div id="footer">
            <script>$('#footer').load('mkt-footer.html');</script>
        </div>
        <script>
            var trianglify = function (a, b, c, d) {
                var t = new Trianglify({
                    cellsize: 500,
                    bleed: 150,
                    cellpadding: 50,
                    noiseIntensity: 0,
                    x_gradient: [a, b, c],
                    y_gradient: [a, b, c],
                    fillOpacity: 1,
                    strokeOpacity: 1});
                var pattern = t.generate(document.body.clientWidth, document.body.clientHeight);
                var area = document.getElementsByClassName(d);
                i = area.length;
                while (i--) {
                    area[i].setAttribute('style', 'background-image: ' + pattern.dataUrl);
                }
                ;
            };
            trianglify("#EEEEEE", "#EAEAEA", "#F5F5F5", "tri-light");
            trianglify("#454F54", "#414B4F", "#4A555A", "tri-dark");
            trianglify("#64CBE0", "#72D2E5", "#7FD6E8", "tri-AT");
            trianglify("#a0c54e", "#a5cc51", "#aad154", "tri-AL");
            trianglify("#ef5540", "#f95744", "#fb5f4d", "tri-AB");
        </script>
    </body>	  
</html>
