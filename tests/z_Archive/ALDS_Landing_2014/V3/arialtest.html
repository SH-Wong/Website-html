<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Welcome to ActiveLearn</title>
    <link rel="stylesheet" href="arialtest.css">
    <link href="//netdna.bootstrapcdn.com/font-awesome/4.0.3/css/font-awesome.css" rel="stylesheet">
	<script src="//ajax.googleapis.com/ajax/libs/jquery/1.11.0/jquery.min.js"></script>
</head>


<body>
	<h1 style="font-family:sans-serif; font-weight:bold">Sans-serif</h1>
	<p style="font-family:sans-serif; font-weight:bold">Sans ; bold</p>
	<p style="font-family:sans-serif; font-weight:500">Sans ; 500</p>
	<p style="font-family:sans-serif; font-weight:normal">Sans ; normal</p>
	<p style="font-family:sans-serif; font-weight:300">Sans ; 300</p>
	
	<h1 style="font-family:arial; font-weight:bold">Merged into arial</h1>
	<p style="font-family:arial; font-weight:bold">Arial ; bold</p>
	<p style="font-family:arial; font-weight:600">Arial ; 600</p>
	<p style="font-family:arial; font-weight:500">Arial ; normal</p>
	<p style="font-family:arial; font-weight:300; font-style:normal">Arial ; 300</p>
	
	<h1 style="font-family:arial; font-weight:bold">Seperate arial medium and light</h1>
	<p style="font-family:arial; font-weight:bold">Arial ; bold</p>
	<p style="font-family:arialMedium; font-weight:500" >arialMedium ; 600</p>
	<p style="font-family:arialMedium; font-style:italic">arialMedium ; italic</p>
	<p style="font-family:arial; font-weight:normal">Arial ; normal</p>
	<p style="font-family:arial; font-style:italic">Arial ; normal</p>
	<p style="font-family:arialLight; font-weight:normal;">arialLight ; 300</p>
	<p style="font-family:arialLight; font-style:italic;">arialLight ; 300</p>
	
	
</body>
</html>
